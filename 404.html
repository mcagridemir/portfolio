<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Muhammed Çağrı Demir</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --deep: #0b2a78; --cobalt: #1f4fbf; --glaze: #f8f6f0; --mu: #4a5a86; --rim: rgba(11,42,120,.38); }
    /* absolute paths: this page is served for any missing URL under /portfolio/ */
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 26px;
      background: var(--glaze) url(/portfolio/img/wall-iznik.jpg) 0 0/360px 360px;
      font-family: 'JetBrains Mono', monospace; color: var(--deep); text-align: center;
    }
    .plate {
      background: var(--glaze); border: 1px solid var(--rim); padding: clamp(36px, 7vw, 64px) clamp(28px, 7vw, 80px);
      box-shadow: 0 0 0 9px var(--glaze), 0 0 0 10px var(--rim), 0 50px 90px -40px rgba(4,14,50,.6);
      display: flex; flex-direction: column; align-items: center; gap: 1.1rem; max-width: 460px;
    }
    .code { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 300; font-size: clamp(96px, 20vw, 150px); line-height: 1; }
    .title { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--cobalt); }
    .msg { font-size: 12.5px; color: var(--mu); line-height: 1.8; }
    .home-link {
      margin-top: .6rem; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; text-decoration: none;
      color: #fff; background: var(--deep); padding: 14px 24px; transition: background .2s;
    }
    .home-link:hover { background: var(--cobalt); }
  </style>
</head>
<body>
  <main class="plate">
    <div class="code">404</div>
    <p class="title">Page not found</p>
    <p class="msg">The page you're looking for doesn't exist — or maybe it moved.</p>
    <a href="/portfolio/" class="home-link">← Back to portfolio</a>
  </main>
</body>
</html>
